# One-click deploy on Render (free plan): https://render.com/deploy?repo=https://github.com/Krush28/Continuity_IQ--AI
services:
  - type: web
    name: continuityiq
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_DEMO
        value: "true"
      - key: DEMO_MODE
        value: "true"
      - key: LLM_PROVIDER
        value: none
